spring:
  application:
    name: algocoach-api
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 10m
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 10m
  profiles:
    active: ollama
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/algocoach}
    username: ${JDBC_USERNAME:algocoach}
    password: ${JDBC_PASSWORD:algocoach}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: algocoach-api
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.pet.proj.contracts
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  ai:
    model:
      chat: ${AI_PROVIDER:ollama}
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        keep-alive: 30m
        options:
          #model: qwen3:8b
          model: qwen2.5-coder:7b
          temperature: 0.0
          top-p: 0.8
          top-k: 20
          num-ctx: ${OLLAMA_NUM_CTX:16384}
          num-predict: ${OLLAMA_NUM_PREDICT:8192}
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        table-name: vector_store
server:
  port: 8080
app:
  task-similarity:
    threshold: 0.7
  solution-similarity:
    threshold: 0.0
  knowledge:
    similarity-threshold: 0.4
  kafka:
    topics:
      submission-created: ${KAFKA_SUBMISSION_CREATED_TOPIC:submission-created}
      submission-completed: ${KAFKA_SUBMISSION_COMPLETED_TOPIC:submission-completed}
